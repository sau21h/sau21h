name: Find locations
# Looks up Threads location IDs for queued posts that have a "place" (see scripts/find_locations.py).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["queue/**", "scripts/find_locations.py", ".github/workflows/locations.yml"]
permissions:
  contents: write
concurrency: repo-write
jobs:
  locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Syntax check
        if: always()
        run: mkdir -p logs && { python -m py_compile scripts/publish.py scripts/find_locations.py && echo ok; } > logs/compile.txt 2>&1; cat logs/compile.txt
      - run: python scripts/find_locations.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Save result
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add queue logs/locations.txt logs/compile.txt
          git diff --cached --quiet || { git commit -m "Find locations" && git pull --rebase -q && git push; }
