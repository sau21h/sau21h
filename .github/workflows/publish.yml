name: Publish daily post
on:
  schedule:
    - cron: "30 13 * * *"   # 20:30 Vietnam time; the job waits until 21:00 (GitHub cron often starts late)
    - cron: "30 14 * * *"   # 21:30 backup in case the first run is skipped; publish.py skips posts already posted
    - cron: "0 4 * * *"     # 11:00 Vietnam time: weekend noon post ("<date>-1130" in the queue), waits until 11:30
    - cron: "0 5 * * *"     # 12:00 backup for the noon post
  workflow_dispatch:
    inputs:
      post_date:
        description: "Publish the post for this date (YYYY-MM-DD) instead of today"
        required: false
  push:  # publish immediately by committing publish-now.txt containing the post date
    branches: [main]
    paths: ["publish-now.txt"]
permissions:
  contents: write
concurrency: repo-write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Project end check (sau21h stops after 2026-10-26)
        run: if [[ "$(TZ=Asia/Ho_Chi_Minh date +%F)" > "2026-10-26" && "${{ github.event_name }}" == "schedule" ]]; then echo "STOPPED=true" >> "$GITHUB_ENV"; echo "project stopped"; fi
      - uses: actions/checkout@v4
        if: env.STOPPED != 'true'
      - uses: actions/setup-python@v5
        if: env.STOPPED != 'true'
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
        if: env.STOPPED != 'true'
      - name: Pick the post date
        if: env.STOPPED != 'true'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f publish-now.txt ]; then echo "POST_DATE=$(tr -dc '0-9-' < publish-now.txt)" >> "$GITHUB_ENV"; git rm -q publish-now.txt;
          elif [ -n "${{ inputs.post_date }}" ]; then echo "POST_DATE=${{ inputs.post_date }}" >> "$GITHUB_ENV"; fi
          case "${{ github.event.schedule }}" in "0 4 * * *"|"0 5 * * *") echo "POST_SLOT=1130" >> "$GITHUB_ENV";; esac
      - name: Wait until 21:00 (or 11:30 for the noon slot) Vietnam time
        if: github.event_name == 'schedule' && env.STOPPED != 'true'
        run: |
          now=$(date -u +%s); if [ "$POST_SLOT" = "1130" ]; then at="04:30"; else at="14:00"; fi; target=$(date -u -d "today $at" +%s)
          if [ "$now" -lt "$target" ]; then echo "waiting $((target - now))s"; sleep $((target - now)); fi
      - name: Publish
        if: env.STOPPED != 'true'
        run: |
          mkdir -p logs
          set -o pipefail
          python scripts/publish.py 2>&1 | tee logs/publish_log.txt
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Record status
        if: always() && env.STOPPED != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A queue logs/publish_log.txt
          git diff --cached --quiet || { git commit -m "Mark post published" && git pull --rebase -q && git push; }
