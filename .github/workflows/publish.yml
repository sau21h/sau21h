name: Publish daily post
on:
  schedule:
    - cron: "0 14 * * *"    # 21:00 Vietnam time
  workflow_dispatch:
    inputs:
      post_date:
        description: "Publish the post for this date (YYYY-MM-DD) instead of today"
        required: false
permissions:
  contents: write
concurrency: repo-write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      - run: python scripts/publish.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_DATE: ${{ inputs.post_date }}
      - name: Record status
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || git commit -m "Mark post published" && git push
