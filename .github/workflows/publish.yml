name: Publish daily post
on:
  schedule:
    - cron: "0 14 * * *"    # 21:00 Vietnam time
  workflow_dispatch:
    inputs:
      post_date:
        description: "Publish the post for this date (YYYY-MM-DD) instead of today"
        required: false
  push:  # publish immediately by committing publish-now.txt containing the post date
    branches: [main]
    paths: ["publish-now.txt"]
permissions:
  contents: write
concurrency: repo-write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      - name: Pick the post date
        run: |
          if [ -f publish-now.txt ]; then echo "POST_DATE=$(tr -dc '0-9-' < publish-now.txt)" >> "$GITHUB_ENV"; git rm -q publish-now.txt;
          elif [ -n "${{ inputs.post_date }}" ]; then echo "POST_DATE=${{ inputs.post_date }}" >> "$GITHUB_ENV"; fi
      - name: Publish
        run: |
          mkdir -p logs
          set -o pipefail
          python scripts/publish.py 2>&1 | tee logs/publish_log.txt
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Record status
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A queue logs/publish_log.txt
          git diff --cached --quiet || git commit -m "Mark post published" && git push
