name: Generate images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["queue/**", "style/**", "scripts/generate.py", ".github/workflows/generate.yml"]
permissions:
  contents: write
concurrency: repo-write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-genai pillow
      - run: python scripts/generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add posts queue logs
          git diff --cached --quiet || { git commit -m "Generate images" && git pull --rebase -q && git push; }
