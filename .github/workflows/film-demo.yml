name: Film look demo
# Renders before/after samples of the people film look into posts/tests/film (never touches real posts).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/film_demo.py", ".github/workflows/film-demo.yml"]
permissions:
  contents: write
concurrency: repo-write
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: mkdir -p logs; python scripts/film_demo.py > logs/film_demo.txt 2>&1 || echo FAILED >> logs/film_demo.txt; cat logs/film_demo.txt
      - name: Save result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add posts/tests/film logs/film_demo.txt
          git diff --cached --quiet || { git commit -m "Film look demo" && git pull --rebase -q && git push; }
